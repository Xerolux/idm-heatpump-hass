<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Example card of the default German measured-data report (structure and wording as shipped) -->
  <rect width="720" height="620" fill="#eef2f6" rx="14"/>
  <g>
    <rect x="36" y="28" width="648" height="552" rx="12" fill="#ffffff" stroke="#d7dee7"/>
    <rect x="36" y="28" width="648" height="54" rx="12" fill="#0f766e"/>
    <rect x="36" y="70" width="648" height="12" fill="#0f766e"/>
    <circle cx="64" cy="55" r="9" fill="#34d399"/>
    <text x="84" y="51" fill="#ffffff" font-size="15" font-weight="700">KI-Bericht (experimentell)</text>
    <text x="84" y="69" fill="#c9f2ec" font-size="11.5">ready · Messwertbericht – ohne KI-Deutung</text>
