<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6770"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <rect width="960" height="470" fill="#f8fafc" rx="14"/>
  <rect x="24" y="20" width="912" height="52" rx="10" fill="url(#hdr)"/>
  <text x="480" y="44" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">Experimental AI plant adviser — read-only by design</text>
  <text x="480" y="62" text-anchor="middle" fill="#c9f2ec" font-size="12">Local collection, measured-data reports by default, optional model explanations behind explicit consent</text>

  <!-- Stage 1: heat pump -->
  <g>
    <rect x="40" y="110" width="170" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="125" y="140" text-anchor="middle" font-size="26">🌡️</text>
    <text x="125" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Heat pump</text>
    <text x="125" y="183" text-anchor="middle" font-size="11" fill="#475569">Navigator 2.0 / 10 / Pro</text>
    <text x="125" y="199" text-anchor="middle" font-size="11" fill="#475569">Modbus TCP + web supplement</text>
  </g>
  <line x1="210" y1="165" x2="252" y2="165" stroke="#5b6770" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Stage 2: collection -->
  <g>
    <rect x="254" y="110" width="190" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="349" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">Local history</text>
    <text x="349" y="156" text-anchor="middle" font-size="11" fill="#334155">1 sample / 5 minutes</text>
    <text x="349" y="172" text-anchor="middle" font-size="11" fill="#334155">14 days, numeric allowlist</text>
    <text x="349" y="188" text-anchor="middle" font-size="11" fill="#334155">no names, PINs or addresses</text>
    <text x="349" y="204" text-anchor="middle" font-size="11" fill="#334155">5–200 MiB storage budget</text>
  </g>
  <line x1="444" y1="165" x2="486" y2="165" stroke="#5b6770" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Stage 3: learning + facts -->
  <g>
    <rect x="488" y="110" width="200" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="588" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">Facts + local learning</text>
    <text x="588" y="156" text-anchor="middle" font-size="11" fill="#334155">period energy, coverage, COP</text>
    <text x="588" y="172" text-anchor="middle" font-size="11" fill="#334155">health-check states</text>
    <text x="588" y="188" text-anchor="middle" font-size="11" fill="#334155">baselines per mode × 5 °C bin</text>
    <text x="588" y="204" text-anchor="middle" font-size="11" fill="#334155">no model training or downloads</text>
  </g>

  <!-- Branch arrows -->
  <path d="M 688 165 L 726 165 L 726 128 L 748 128" fill="none" stroke="#5b6770" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 688 165 L 726 165 L 726 218 L 748 218" fill="none" stroke="#5b6770" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Default path -->
  <g>
    <rect x="750" y="88" width="176" height="80" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.6"/>
    <text x="838" y="114" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f766e">Measured-data report</text>
    <text x="838" y="132" text-anchor="middle" font-size="11" fill="#065f46">default — no model call,</text>
    <text x="838" y="148" text-anchor="middle" font-size="11" fill="#065f46">no key, no cloud access</text>
  </g>

  <!-- Optional path -->
  <g>
    <rect x="750" y="178" width="176" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="838" y="202" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Model explanations</text>
    <text x="838" y="220" text-anchor="middle" font-size="11" fill="#475569">separate opt-in: local Ollama,</text>
    <text x="838" y="236" text-anchor="middle" font-size="11" fill="#475569">HA AI Task, OpenAI, Z.ai</text>
    <text x="838" y="252" text-anchor="middle" font-size="11" fill="#475569">numeric-integrity guard</text>
  </g>

  <!-- Output -->
  <line x1="926" y1="128" x2="926" y2="0" stroke="none"/>
  <path d="M 838 258 L 838 292" fill="none" stroke="#5b6770" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g>
    <rect x="640" y="294" width="286" height="66" rx="10" fill="#0f172a"/>
    <text x="783" y="320" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f8fafc">Report sensor · 4 buttons · dashboard export</text>
    <text x="783" y="340" text-anchor="middle" font-size="11" fill="#94a3b8">schedule 1–168 h, restart-safe · progress attributes</text>
  </g>

  <!-- Privacy boundary -->
  <g>
    <rect x="640" y="294" width="0" height="0"/>
    <rect x="40" y="294" width="560" height="66" rx="10" fill="#fffbeb" stroke="#d97706"/>
    <text x="320" y="318" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">🔒 Privacy boundary</text>
    <text x="320" y="338" text-anchor="middle" font-size="11" fill="#78350f">Measurements leave Home Assistant only through an explicitly consented cloud path,</text>
    <text x="320" y="352" text-anchor="middle" font-size="11" fill="#78350f">as a numerical allowlist with fixed endpoints, masked keys and a daily request limit.</text>
  </g>

  <!-- Footer strip -->
  <g>
    <rect x="40" y="384" width="886" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="483" y="408" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Reports explain observations and uncertainty — no fault diagnosis, no guaranteed savings, no plant writes.</text>
    <text x="483" y="428" text-anchor="middle" font-size="11" fill="#64748b">Off by default · experimental · German and English report languages · learning stays local</text>
  </g>
</svg>
