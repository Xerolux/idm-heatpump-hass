<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="960" height="430" fill="#f8fafc" rx="14"/>
  <rect x="24" y="20" width="912" height="46" rx="10" fill="url(#hub)"/>
  <text x="480" y="42" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">iDM Smart Energy &amp; Comfort — the optional Smart profile</text>
  <text x="480" y="58" text-anchor="middle" fill="#d3e8fd" font-size="11.5">Analysis is read-only; writing features stay off until explicitly enabled and confirmed</text>

  <!-- Central hub -->
  <g>
    <rect x="345" y="105" width="270" height="64" rx="12" fill="#0f172a"/>
    <text x="480" y="132" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">Smart profile (opt-in)</text>
    <text x="480" y="151" text-anchor="middle" fill="#94a3b8" font-size="11">guided setup: Standard · Advanced · Expert</text>
  </g>

  <line x1="480" y1="169" x2="480" y2="196" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="160" y1="196" x2="800" y2="196" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="160" y1="196" x2="160" y2="218" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="373" y1="196" x2="373" y2="218" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="586" y1="196" x2="586" y2="218" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="800" y1="196" x2="800" y2="218" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Card 1: energy -->
  <g>
    <rect x="40" y="220" width="240" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="160" y="246" text-anchor="middle" font-size="20">⚡</text>
    <text x="160" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Energy &amp; costs</text>
    <text x="160" y="288" text-anchor="middle" font-size="11" fill="#334155">electrical + thermal totals,</text>
    <text x="160" y="303" text-anchor="middle" font-size="11" fill="#334155">COP, daily / monthly stats,</text>
    <text x="160" y="318" text-anchor="middle" font-size="11" fill="#334155">estimated cost, CO₂, PV share</text>
    <rect x="100" y="332" width="120" height="20" rx="10" fill="#ecfdf5" stroke="#0f766e"/>
    <text x="160" y="346" text-anchor="middle" font-size="10.5" fill="#0f766e" font-weight="700">read-only</text>
  </g>

  <!-- Card 2: health -->
  <g>
    <rect x="253" y="220" width="240" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="373" y="246" text-anchor="middle" font-size="20">🩺</text>
    <text x="373" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Health Monitor &amp; advice</text>
    <text x="373" y="288" text-anchor="middle" font-size="11" fill="#334155">8 diagnostic checks, alarm and</text>
    <text x="373" y="303" text-anchor="middle" font-size="11" fill="#334155">cycle hints, heating-curve and</text>
    <text x="373" y="318" text-anchor="middle" font-size="11" fill="#334155">weather-preheat advice</text>
    <rect x="313" y="332" width="120" height="20" rx="10" fill="#ecfdf5" stroke="#0f766e"/>
    <text x="373" y="346" text-anchor="middle" font-size="10.5" fill="#0f766e" font-weight="700">read-only</text>
  </g>

  <!-- Card 3: writes -->
  <g>
    <rect x="466" y="220" width="240" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="586" y="246" text-anchor="middle" font-size="20">🗓️</text>
    <text x="586" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Comfort &amp; PV boost</text>
    <text x="586" y="288" text-anchor="middle" font-size="11" fill="#334155">16 daily comfort windows,</text>
    <text x="586" y="303" text-anchor="middle" font-size="11" fill="#334155">PV-surplus hot-water boost</text>
    <text x="586" y="318" text-anchor="middle" font-size="11" fill="#334155">with restart recovery</text>
    <rect x="516" y="332" width="140" height="20" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <text x="586" y="346" text-anchor="middle" font-size="10.5" fill="#92400e" font-weight="700">writes · opt-in + confirm</text>
  </g>

  <!-- Card 4: forwarding -->
  <g>
    <rect x="680" y="220" width="240" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="800" y="246" text-anchor="middle" font-size="20">🔌</text>
    <text x="800" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">External power forwarding</text>
    <text x="800" y="288" text-anchor="middle" font-size="11" fill="#334155">PV, household, battery and</text>
    <text x="800" y="303" text-anchor="middle" font-size="11" fill="#334155">surplus sensors → existing</text>
    <text x="800" y="318" text-anchor="middle" font-size="11" fill="#334155">GLT registers, off until set up</text>
    <rect x="740" y="332" width="120" height="20" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <text x="800" y="346" text-anchor="middle" font-size="10.5" fill="#92400e" font-weight="700">writes · opt-in</text>
  </g>

  <text x="480" y="408" text-anchor="middle" fill="#5b6770" font-size="11.5">Invalid readings and long polling gaps are excluded · separate Analytics, Health and Comfort device groups · entity IDs stay unchanged</text>
</svg>
