# Home Assistant Integration Quality Scale
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
#
# Current target: Gold readiness for the custom integration
# HACS compatible: yes
# This file tracks readiness work only. Official Home Assistant quality-scale
# status is assigned by Home Assistant after a Core submission and review.

rules:

  # ── BRONZE ─────────────────────────────────────────────────────────────────

  action-setup:
    status: done
    comment: >
      Services are registered in async_setup (services.py:async_setup_services),
      not in async_setup_entry.

  appropriate-polling:
    status: done
    comment: >
      Polling interval is user-configurable (5–300 s, default 10 s).
      DataUpdateCoordinator manages the schedule.

  brands:
    status: done
    comment: >
      Brand assets (icon.png, logo.png) are present in the brand/ directory.

  common-modules:
    status: done
    comment: >
      Shared DeviceInfo and available-logic are centralised in entity.py (IdmEntity).
      All platforms inherit from this base class.

  config-flow:
    status: done
    comment: >
      Full UI config flow with connection test, options flow, and reconfigure flow.

  config-flow-test-coverage:
    status: done
    comment: >
      config_flow.py is covered to 100% (statements) by the pytest suite,
      enforced in CI by a dedicated --cov-fail-under=100 step. The tests cover
      the user, options, zones, reconfigure and diagnostics steps, the
      Modbus-failure recovery with its web-only fallback, and every connection
      and web-detection failure mode.

  dependency-transparency:
    status: done
    comment: >
      manifest.json declares the exact direct transport pair
      modbus-connection==4.10.0 and tmodbus[async-serial]==0.6.1, followed by
      the pinned idm-heatpump-api[web]==2.0.0 device/web library. The injected
      transport path carries no pymodbus dependency.

  docs-actions:
    status: done
    comment: >
      services.yaml documents domain service actions (set_system_mode,
      acknowledge_errors, write_register, set_external_climate,
      set_external_power, DHW boost
      start/cancel) with field descriptions. de.json includes translated
      service documentation.

  docs-conditions:
    status: exempt
    comment: >
      The integration does not provide integration-specific conditions.

  docs-triggers:
    status: exempt
    comment: >
      The integration does not provide integration-specific triggers.

  docs-high-level-description:
    status: done
    comment: >
      README.md provides a high-level overview of the integration and the
      IDM Navigator 2.0 / 10 heat pump.

  docs-installation-instructions:
    status: done
    comment: >
      docs/wiki/Installation-and-Setup.md contains step-by-step installation
      instructions including HACS and manual install.

  docs-removal-instructions:
    status: done
    comment: >
      docs/wiki/Installation-and-Setup.md contains a "Deinstallation" section
      with step-by-step removal instructions (UI deletion + optional file cleanup).

  entity-event-setup:
    status: done
    comment: >
      IdmTechnicianCodeSensor subscribes to time-interval events in
      async_added_to_hass and cleans up in async_will_remove_from_hass.

  entity-unique-id:
    status: done
    comment: >
      All entities use "{config_entry_id}_{register_name}" so IDs remain stable
      when host, port, or slave settings change. Version 1.2 migrates legacy IDs.

  has-entity-name:
    status: done
    comment: >
      All entity classes set _attr_has_entity_name = True.

  runtime-data:
    status: done
    comment: >
      IdmHeatpumpData dataclass is stored in ConfigEntry.runtime_data.
      No hass.data usage for integration data.

  test-before-configure:
    status: done
    comment: >
      config_flow.py:_test_connection() runs a live Modbus connection test
      before creating the config entry.

  test-before-setup:
    status: done
    comment: >
      async_setup_entry raises ConfigEntryNotReady if the initial connection
      to the heat pump fails.

  unique-config-entry:
    status: done
    comment: >
      Connection data (host, port, slave ID) is matched before setup to prevent
      duplicates without using a mutable IP address as the config-entry unique ID.

  # ── SILVER ─────────────────────────────────────────────────────────────────

  action-exceptions:
    status: done
    comment: >
      Services raise ServiceValidationError for invalid user input (invalid mode,
      missing risk acknowledgement) and HomeAssistantError for communication
      failures, both with translation keys.

  config-entry-unloading:
    status: done
    comment: >
      async_unload_entry unloads all platforms and disconnects the Modbus client.

  docs-configuration-parameters:
    status: done
    comment: >
      docs/wiki/Configuration.md and the config flow translations document all
      configuration parameters.

  docs-installation-parameters:
    status: done
    comment: >
      Installation parameters (host, port, slave_id) are documented in
      Installation-and-Setup.md and in the config flow step descriptions.

  entity-unavailable:
    status: done
    comment: >
      IdmEntity.available returns False when coordinator data is missing,
      the coordinator update failed, or the register value is the UNUSED sentinel.

  integration-owner:
    status: done
    comment: >
      manifest.json codeowners: ["@xerolux"].

  log-when-unavailable:
    status: done
    comment: >
      DataUpdateCoordinator automatically logs once when transitioning to
      unavailable and once when reconnecting. No extra logging needed.

  parallel-updates:
    status: done
    comment: >
      PARALLEL_UPDATES = 0 is set in every platform module, deferring update
      control to the DataUpdateCoordinator.

  reauthentication-flow:
    status: exempt
    comment: >
      The integration uses local Modbus TCP with no user authentication.
      Re-authentication is not applicable.

  test-coverage:
    status: done
    comment: >
      The pytest suite covers more than 95% of the integration; CI enforces the
      threshold with --cov-fail-under=95 instead of only reporting it. Covered
      areas include setup/unload, config and reconfigure flows, coordinator
      polling, all platforms, services, DHW boost, operation analysis,
      forwarding, diagnostics, repairs, API contracts and the optional web
      supplement. The suite runs against an in-repository Home Assistant test
      double; mypy runs against the real Home Assistant releases in the CI
      matrix.
  # ── GOLD ───────────────────────────────────────────────────────────────────

  devices:
    status: done
    comment: >
      All entities set device_info with DeviceInfo (centralized in IdmEntity /
      build_device_info). Optional device hierarchy creates subdevices for
      heating circuits, zones, solar, ISC, cascade and aux heat.

  diagnostics:
    status: done
    comment: >
      diagnostics.py implements async_get_config_entry_diagnostics and redacts
      Modbus/web connection settings, the local web PIN and detailed web error
      connection strings.

  discovery:
    status: exempt
    comment: >
      Modbus TCP devices have no network discovery protocol. Manual IP
      configuration is required.

  discovery-update-info:
    status: exempt
    comment: >
      Not applicable – no discovery protocol available for Modbus TCP.

  docs-data-update:
    status: done
    comment: >
      docs/wiki/Data-Update.md explains the DataUpdateCoordinator polling mechanism,
      batch Modbus reads (up to 40 exactly adjacent, non-overlapping words), configurable interval,
      optimistic writes, and repair-issue error handling.

  docs-examples:
    status: done
    comment: >
      docs/wiki/Examples.md provides 7 automation YAML examples: vacation mode,
      return-home mode, fault notification, PV surplus hot water boost, heating
      circuit schedule, energy dashboard, and smart-grid control.

  docs-known-limitations:
    status: done
    comment: >
      docs/wiki/Known-Limitations.md documents: device compatibility, Modbus TCP
      only, EEPROM write throttling (88 registers, 1/min), single device per
      config entry, read-only registers, zone module limits, polling-only
      (no push), and firmware update limitations.

  docs-supported-devices:
    status: done
    comment: >
      docs/wiki/Supported-Devices.md lists IDM Navigator 2.0 / 10 and Navigator Pro
      as confirmed, documents Modbus TCP prerequisites, unsupported devices,
      and untested compatible models.

  docs-supported-functions:
    status: done
    comment: >
      docs/wiki/Entities.md and docs/wiki/Modbus-Register.md document all
      entities and their Modbus register mappings.

  docs-troubleshooting:
    status: done
    comment: >
      docs/wiki/Troubleshooting.md provides troubleshooting guidance.

  docs-use-cases:
    status: done
    comment: >
      README.md and docs/wiki/Services.md describe use cases such as holiday
      mode, smart-grid control, and zone room management.

  dynamic-devices:
    status: done
    comment: >
      One config entry describes one heat pump, so no new physical devices
      appear after setup. The optional device hierarchy still creates and
      removes subdevices (heating circuits, zones, solar, ISC, cascade, aux
      heat) from the detected model and the configured options, and
      cleanup_stale_hierarchy_devices removes the ones that lose their
      registers.

  entity-category:
    status: done
    comment: >
      Diagnostic sensors (error codes, valve/pump status, firmware) use
      EntityCategory.DIAGNOSTIC. Number and select entities use
      EntityCategory.CONFIG.

  entity-device-class:
    status: done
    comment: >
      Temperature sensors use SensorDeviceClass.TEMPERATURE, power sensors use
      POWER, energy sensors use ENERGY, number entities use
      NumberDeviceClass.TEMPERATURE where applicable.

  # Not scale rules, but tracked here because Gold reviewers look for them:
  # state classes are inferred from the device class via _DC_STATE_CLASS_MAP and
  # suggested display precision from the unit via
  # infer_suggested_display_precision, both in adapter_descriptions.py, and both
  # are enforced by contract tests.

  entity-disabled-by-default:
    status: done
    comment: >
      Technical/rarely-used entities (valve positions, pump statuses, compressor
      stages, power limits, firmware version) are disabled by default via
      entity_registry_enabled_default=False.

  entity-translations:
    status: done
    comment: >
      Every entity is named from the translation files: entity_names.py maps a
      register to its translation key and placeholders (heating circuits and
      zone rooms share one key and pass the circuit letter or the zone/room
      index as a placeholder), and no entity description carries a hardcoded
      name. strings.json plus the en/de translations are generated by
      scripts/generate_entity_translations.py, and tests/test_entity_translations.py
      pins that every entity of the largest possible plant has a translated name
      whose placeholders match the ones the entity supplies.

  exception-translations:
    status: done
    comment: >
      ServiceValidationError and HomeAssistantError are raised with
      translation_domain=DOMAIN and translation_key referencing the
      "exceptions" block in en.json / de.json.

  icon-translations:
    status: done
    comment: >
      icons.json defines icons for all entity keys across all platforms.

  reconfiguration-flow:
    status: done
    comment: >
      async_step_reconfigure in config_flow.py allows updating the host,
      port, and slave_id after initial setup.

  repair-issues:
    status: done
    comment: >
      coordinator.py creates a repair issue (ir.async_create_issue) when
      Modbus communication fails and deletes it on recovery.

  stale-devices:
    status: done
    comment: >
      cleanup_stale_hierarchy_devices removes hierarchy subdevices that are no
      longer referenced after option changes or model reconfiguration.

  # ── PLATINUM ───────────────────────────────────────────────────────────────

  async-dependency:
    status: done
    comment: >
      ModbusConnectionTransport uses the async modbus-connection/tmodbus
      backend for direct socket I/O. idm-heatpump-api remains responsible for
      device logic, and all Modbus and optional web I/O is non-blocking async.

  inject-websession:
    status: done
    comment: >
      The optional web supplement clients use Home Assistant's session helpers:
      a hostname reuses async_get_clientsession, and an IP address gets an
      async_create_clientsession with an unsafe cookie jar (the Navigator sets
      cookies for a bare IP, which the shared safe jar drops). Modbus remains
      the baseline data path and needs no HTTP session.

  strict-typing:
    status: done
    comment: >
      mypy.ini is plain "strict = true": no disabled error code and no relaxed
      strictness flag. The CI matrix runs it against the real runtime (Home
      Assistant 2026.8.1 and the next beta, the pinned idm-heatpump-api and the
      API main branch) - without the runtime installed every Home Assistant
      import would be Any and the check would pass without checking anything.
      idm-heatpump-api ships py.typed.
