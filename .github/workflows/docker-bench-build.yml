name: Docker Bench Build

# Keeps the live read-only Docker test bench (docker/live-readonly-test)
# buildable. The bench is the enforcement point for every real-hardware
# validation this project allows, and it rots silently: stale wheel defaults,
# a dropped pymodbus step and an unpinned HA base all survived unnoticed until
# the 2026-11-08 refresh. This workflow rebuilds all four images from the
# exact API version the manifest pins, on a schedule, without any hardware:
# a failure here means the next field validation cannot even start.

on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-bench-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # guardrails-disable-line

      - name: Resolve the pinned idm-heatpump-api version
        id: pin
        run: |
          set -eu
          version="$(python3 - <<'PY'
          import json, re, sys
          requirements = json.load(open("custom_components/idm_heatpump/manifest.json"))["requirements"]
          match = re.search(r"idm-heatpump-api\[web\]==([0-9][0-9A-Za-z.\-]*)", " ".join(requirements))
          if not match:
              sys.exit("manifest does not pin idm-heatpump-api")
          print(match.group(1))
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Pinned API: $version"

      - name: Check out the API repository at the pinned tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # guardrails-disable-line
        with:
          repository: Xerolux/idm-heatpump-api
          ref: "v${{ steps.pin.outputs.version }}"
          path: idm-heatpump-api

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # guardrails-disable-line
        with:
          python-version: "3.14"

      - name: Build the API wheel from the pinned source
        id: wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist idm-heatpump-api
          wheel="$(basename "$(find dist -name 'idm_heatpump_api-*.whl' | head -1)")"
          echo "name=$wheel" >> "$GITHUB_OUTPUT"
          test -n "$wheel"
          mkdir -p docker/live-readonly-test/homeassistant/wheels docker/live-readonly-test/api-tester/wheels
          cp "dist/$wheel" docker/live-readonly-test/homeassistant/wheels/
          cp "dist/$wheel" docker/live-readonly-test/api-tester/wheels/
          sha256sum "dist/$wheel"

      - name: Build all four bench images
        working-directory: docker/live-readonly-test
        env:
          API_WHEEL: ${{ steps.wheel.outputs.name }}
        run: docker compose build

      - name: Prove the probes import against the pinned API
        run: |
          docker run --rm --entrypoint python live-readonly-test-api-tester -c "
          import importlib.util
          for name in ('run_api_tests', 'ha_probe'):
              spec = importlib.util.spec_from_file_location(name, f'/app/{name}.py')
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              print(name, 'imports OK')
          "

      - name: Prove the HA image satisfies the integration requirements
        run: |
          docker run --rm --entrypoint python live-readonly-test-homeassistant -c "
          import importlib.metadata as metadata
          print('homeassistant', metadata.version('homeassistant'))
          print('idm-heatpump-api', metadata.version('idm-heatpump-api'))
          print('modbus-connection', metadata.version('modbus-connection'))
          print('tmodbus', metadata.version('tmodbus'))
          import modbus_connection, tmodbus, idm_heatpump
          print('transport pair + API importable')
          "
