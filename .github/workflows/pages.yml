name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/public/**'
      - 'docs/wiki/**'
      - 'docs/images/**'
      - 'custom_components/idm_heatpump/manifest.json'
      - 'hacs.json'
      - 'scripts/build_pages.py'
      - 'scripts/render_pages_markdown.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # guardrails-disable-line
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # guardrails-disable-line
      - name: Build Pages artifact
        run: python scripts/build_pages.py --output _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # guardrails-disable-line
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # guardrails-disable-line
