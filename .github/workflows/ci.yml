name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
        home-assistant-version:
          # The declared minimum in hacs.json/manifest.json, and the version the
          # release workflow validates against.
          - "2026.8.1"
          # The next Home Assistant release, so its device-registry deprecations
          # and API removals surface here before users hit them. Move this to
          # "2026.9.0" once the stable artifact is on PyPI.
          - "2026.9.0b0"
        api-dependency-mode:
          - manifest-pinned
          - api-main
    uses: ./.github/workflows/python-quality.yml
    with:
      python-version: ${{ matrix.python-version }}
      home-assistant-version: ${{ matrix.home-assistant-version }}
      api-dependency-mode: ${{ matrix.api-dependency-mode }}

  # Audit package E1: the unit suite stubs Home Assistant, so lifecycle bugs
  # (unload leaks, registry/store misuse) are invisible to it. This leg boots
  # a genuine Home Assistant and walks setup, reload and unload for real.
  smoke:
    runs-on: ubuntu-latest
    name: Real Home Assistant smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # guardrails-disable-line
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # guardrails-disable-line
        with:
          python-version: "3.14"
      - name: Install Home Assistant 2026.8.1 and test tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "homeassistant==2026.8.1" "aiohttp>=3.8.0" pytest pytest-asyncio
      - name: Install manifest runtime dependencies
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          with open("custom_components/idm_heatpump/manifest.json", encoding="utf-8") as manifest_file:
              requirements = json.load(manifest_file)["requirements"]

          subprocess.check_call([sys.executable, "-m", "pip", "install", *requirements])
          PY
      - name: Verify the requested Home Assistant version is the installed one
        run: |
          python - <<'PY'
          import sys

          from homeassistant.const import __version__

          if __version__ != "2026.8.1":
              print(f"Requested Home Assistant 2026.8.1, but {__version__} is installed")
              sys.exit(1)
          print(f"Home Assistant {__version__} confirmed")
          PY
      - name: Run real-Home-Assistant smoke tests
        run: pytest tests_ha/ -v --tb=short

  hacs:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: HACS Validation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # guardrails-disable-line
      - name: HACS Action
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa  # guardrails-disable-line
        with:
          category: integration
          ignore: description topics

  hassfest:
    runs-on: ubuntu-latest
    name: Hassfest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # guardrails-disable-line
      - name: Hassfest Action
        uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93  # guardrails-disable-line
