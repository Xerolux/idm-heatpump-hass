name: Dependency Freshness

# Keeps the exactly pinned runtime dependencies from silently falling behind.
# The pins are what makes a release reproducible, but nothing in the repository
# notices when a pinned library publishes a new version — that is how the
# transport pin stayed on the modbus-connection 4.0.0a3 alpha while 4.8.1 was
# current. This runs the update pipeline daily: it checks PyPI for every pin the
# manifest declares, validates the result and merges it into main.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      auto-merge:
        description: Merge the pull request into main once the checks pass
        required: false
        default: true
        type: boolean
      merge-major:
        description: Merge a major version bump too, without waiting for a review
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: dependency-update
  cancel-in-progress: false

jobs:
  update:
    uses: ./.github/workflows/dependency-update.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      # A manual run can say otherwise; the daily run always proposes, validates
      # and merges on its own.
      auto-merge: ${{ inputs.auto-merge != false }}
      merge-major: ${{ inputs.merge-major == true }}
