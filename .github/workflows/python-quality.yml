name: Python Quality

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used for validation
        required: true
        type: string
      home-assistant-version:
        description: Home Assistant version used for validation
        required: true
        type: string
      api-dependency-mode:
        description: Use the manifest pin or the API main branch
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ inputs.python-version }} / HA ${{ inputs.home-assistant-version }} / ${{ inputs.api-dependency-mode }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # guardrails-disable-line

      - name: Validate API dependency mode
        env:
          API_DEPENDENCY_MODE: ${{ inputs.api-dependency-mode }}
        run: |
          case "$API_DEPENDENCY_MODE" in
            manifest-pinned|api-main) ;;
            *)
              echo "Unsupported API dependency mode: $API_DEPENDENCY_MODE"
              exit 1
              ;;
          esac

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # guardrails-disable-line
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Home Assistant ${{ inputs.home-assistant-version }} and test tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "homeassistant==${{ inputs.home-assistant-version }}" "aiohttp>=3.8.0"
          pip install ruff mypy pytest pytest-cov pytest-asyncio pytest-homeassistant-custom-component

      - name: Install manifest runtime dependencies
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          with open("custom_components/idm_heatpump/manifest.json", encoding="utf-8") as manifest_file:
              requirements = json.load(manifest_file)["requirements"]

          subprocess.check_call([sys.executable, "-m", "pip", "install", *requirements])
          PY

      - name: Install API main branch
        if: inputs.api-dependency-mode == 'api-main'
        run: |
          pip install --upgrade \
            "git+https://github.com/Xerolux/idm-heatpump-api.git@main#egg=idm-heatpump-api[web]"

      - name: Smoke test production Modbus backend
        run: |
          python - <<'PY'
          import asyncio
          from importlib.metadata import version

          from modbus_connection import ModbusTcpParams
          from modbus_connection.tmodbus import ModbusConnection

          from custom_components.idm_heatpump.modbus_client import IdmModbusConnectionClient

          connection = ModbusConnection(
              ModbusTcpParams(host="192.0.2.1", port=502),
              timeout=1.0,
          )
          assert type(connection).__module__ == "modbus_connection.tmodbus"
          assert connection.for_unit(1).__class__.__module__ == "modbus_connection.tmodbus"

          client = IdmModbusConnectionClient("192.0.2.1")
          asyncio.run(client.disconnect())
          print(
              "Production Modbus imports OK:",
              version("modbus-connection"),
              version("tmodbus"),
          )
          PY

      - name: Lint with Ruff
        run: ruff check custom_components/idm_heatpump tests --line-length=120 --output-format=github

      - name: Format check with Ruff
        run: ruff format custom_components/idm_heatpump tests --check

      - name: Type check with mypy
        run: mypy custom_components/idm_heatpump

      # English is the contract for everything the project publishes about
      # itself; see docs/RELEASE_PROCESS.md, "Language".  The test suite fails on
      # this too, but a separate step names the reason in the job list.
      - name: Check documentation language
        run: python scripts/check_documentation_language.py

      - name: Run unit tests
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=custom_components/idm_heatpump \
            --cov-report=xml \
            --cov-report=term-missing
