name: Python Quality

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used for validation
        required: true
        type: string
      home-assistant-version:
        description: Home Assistant version used for validation
        required: true
        type: string
      api-dependency-mode:
        description: Use the manifest pin or the API main branch
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ inputs.python-version }} / HA ${{ inputs.home-assistant-version }} / ${{ inputs.api-dependency-mode }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # guardrails-disable-line

      - name: Validate API dependency mode
        env:
          API_DEPENDENCY_MODE: ${{ inputs.api-dependency-mode }}
        run: |
          case "$API_DEPENDENCY_MODE" in
            manifest-pinned|api-main) ;;
            *)
              echo "Unsupported API dependency mode: $API_DEPENDENCY_MODE"
              exit 1
              ;;
          esac

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # guardrails-disable-line
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Home Assistant ${{ inputs.home-assistant-version }} and test tools
        env:
          HOME_ASSISTANT_VERSION: ${{ inputs.home-assistant-version }}
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "homeassistant==${HOME_ASSISTANT_VERSION}" "aiohttp>=3.8.0"
          # pytest-homeassistant-custom-component is deliberately absent: it pins
          # homeassistant to one exact version, so installing it silently replaced
          # whatever this matrix leg asked for and made the version matrix
          # decorative. Its plugin is disabled in pytest.ini (-p no:homeassistant)
          # and no test imports it, so nothing here needs it.
          pip install ruff mypy pytest pytest-cov pytest-asyncio

      - name: Verify the requested Home Assistant version is the installed one
        env:
          HOME_ASSISTANT_VERSION: ${{ inputs.home-assistant-version }}
        run: |
          python - <<'PY'
          import os
          import sys

          from homeassistant.const import __version__

          requested = os.environ["HOME_ASSISTANT_VERSION"]
          if __version__ != requested:
              # A transitive pin displaced the matrix version. Fail loudly rather
              # than reporting a green run for a version that was never tested.
              print(f"Requested Home Assistant {requested}, but {__version__} is installed")
              sys.exit(1)
          print(f"Home Assistant {__version__} confirmed")
          PY

      - name: Install manifest runtime dependencies
        env:
          API_DEPENDENCY_MODE: ${{ inputs.api-dependency-mode }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          with open("custom_components/idm_heatpump/manifest.json", encoding="utf-8") as manifest_file:
              requirements = json.load(manifest_file)["requirements"]

          # In api-main mode the API comes from git in the next step. Skipping the
          # pinned API here keeps that leg meaningful while the pin points at a
          # version that is not on PyPI yet - which is exactly the situation
          # during a breaking API transition, when its signal matters most.
          if os.environ["API_DEPENDENCY_MODE"] == "api-main":
              requirements = [
                  requirement
                  for requirement in requirements
                  if not requirement.startswith("idm-heatpump-api")
              ]

          subprocess.check_call([sys.executable, "-m", "pip", "install", *requirements])
          PY

      - name: Install API main branch
        if: inputs.api-dependency-mode == 'api-main'
        run: |
          pip install --upgrade \
            "idm-heatpump-api[web] @ git+https://github.com/Xerolux/idm-heatpump-api.git@main"

      - name: Smoke test production Modbus backend
        run: |
          python - <<'PY'
          import asyncio
          from importlib.metadata import version

          from modbus_connection import ModbusTcpParams
          from modbus_connection.tmodbus import ModbusConnection

          from custom_components.idm_heatpump.modbus_client import IdmModbusConnectionClient

          connection = ModbusConnection(
              ModbusTcpParams(host="192.0.2.1", port=502),
              timeout=1.0,
          )
          assert type(connection).__module__ == "modbus_connection.tmodbus"
          assert connection.for_unit(1).__class__.__module__ == "modbus_connection.tmodbus"

          client = IdmModbusConnectionClient("192.0.2.1")
          asyncio.run(client.disconnect())
          print(
              "Production Modbus imports OK:",
              version("modbus-connection"),
              version("tmodbus"),
          )
          PY

      - name: Lint with Ruff
        run: ruff check custom_components/idm_heatpump tests --line-length=120 --output-format=github

      - name: Format check with Ruff
        run: ruff format custom_components/idm_heatpump tests --check

      - name: Type check with mypy
        run: mypy custom_components/idm_heatpump

      # English is the contract for everything the project publishes about
      # itself; see docs/RELEASE_PROCESS.md, "Language".  The test suite fails on
      # this too, but a separate step names the reason in the job list.
      - name: Check documentation language
        run: python scripts/check_documentation_language.py

      # The Home Assistant quality scale asks for more than 95 % test coverage
      # (Silver "test-coverage"); --cov-fail-under turns that from a number in a
      # log into a gate, so coverage cannot quietly decay between releases.
      - name: Run unit tests
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=custom_components/idm_heatpump \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=95

      # Bronze "config-flow-test-coverage" requires a fully covered config flow.
      # It is measured over the whole suite, not just tests/test_config_flow.py,
      # because other tests drive the flow as well.
      - name: Check config flow coverage
        run: |
          pytest tests/ \
            -q \
            --cov=custom_components.idm_heatpump.config_flow \
            --cov-report=term-missing \
            --cov-fail-under=100
