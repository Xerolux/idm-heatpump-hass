name: API Dependency Update

# The API repository announces a stable release here instead of waiting for the
# daily freshness run, because pip can take a while to see a fresh artifact.
# Everything after resolving the version is the shared update pipeline.

on:
  repository_dispatch:
    types: [idm_heatpump_api_release]
  workflow_dispatch:
    inputs:
      api_version:
        description: Stable idm-heatpump-api version to pin exactly (X.Y.Z)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: dependency-update
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve API version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.api.outputs.version }}
    steps:
      # The version arrives from another repository, so it is validated before
      # it is used for anything at all.
      - name: Resolve API version
        id: api
        env:
          REQUESTED_API_VERSION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.version || inputs.api_version }}
        run: |
          VERSION="$REQUESTED_API_VERSION"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "API version must be a stable SemVer in X.Y.Z format" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  update:
    needs: resolve
    uses: ./.github/workflows/dependency-update.yml
    secrets:
      # Only this one, never `inherit`: the pipeline needs no other
      # secret, and it is empty when the repository has not set it.
      DEPENDENCY_UPDATE_TOKEN: ${{ secrets.DEPENDENCY_UPDATE_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      set-pin: idm-heatpump-api==${{ needs.resolve.outputs.version }}
