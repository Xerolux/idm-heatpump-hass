version: 2
updates:
  # Every action in this repository is pinned by commit SHA, so nothing but
  # Dependabot moves those pins. One grouped pull request per week keeps
  # actions that must move together in the same change — codeql-action/init and
  # codeql-action/analyze fail the job on a version skew, and as two separate
  # pull requests each of them is red on its own.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci

  # There is deliberately no "pip" entry: the integration declares its runtime
  # dependencies in custom_components/idm_heatpump/manifest.json, which is not a
  # manifest format Dependabot reads. Those exact pins are checked against PyPI
  # daily and updated by .github/workflows/dependency-freshness.yml through
  # scripts/check_dependency_pins.py.
