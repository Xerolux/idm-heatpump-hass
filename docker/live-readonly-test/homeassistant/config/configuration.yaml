# Minimal Home Assistant configuration for the read-only IDM test bench.
# default_config loads frontend, api, websocket_api, config, scene, logbook,
# history, etc. The IDM integration itself is loaded from a preseeded config
# entry in .storage/core.config_entries (generated from .env by build.ps1).
default_config:

api:
websocket_api:

# Persist a healthy amount of history for the stability test evaluation.
recorder:
  purge_keep_days: 2
  commit_interval: 5

logger:
  default: info
  logs:
    custom_components.idm_heatpump: debug
    idm_heatpump: info

# A SECOND holder on the same read-only Modbus endpoint: Home Assistant's
# core modbus integration claims the same unit the IDM integration shares.
# This exercises the shared-connection contract (reference counting across
# holders, one physical link) during deliberate proxy restarts. Strictly
# read-only: the modbus platform here only polls one input register.
modbus:
  - name: idm-shared-link-second-holder
    type: tcp
    host: modbus-proxy
    port: 5020
    sensors:
      - name: second_holder_probe
        address: 4108
        input_type: holding
        scan_interval: 30
