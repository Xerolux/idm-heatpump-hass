[mypy]
# Strict typing for the IDM Heatpump integration, as the Home Assistant quality
# scale asks for (Platinum rule "strict-typing"):
# https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/strict-typing/
#
# No error code is disabled and no strictness flag is relaxed. Run it with the
# real runtime installed (Home Assistant plus the pinned dependencies), the way
# .github/workflows/python-quality.yml does - without them every import is Any
# and the check silently passes.

strict = true
explicit_package_bases = true
namespace_packages = true
mypy_path = .
